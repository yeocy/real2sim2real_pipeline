# LIBERO-10 task 03 twin scene 생성
#   put the black bowl in the bottom drawer of the cabinet and close it
#   입력: inputs_libero_10/03_KITCHEN_SCENE4_put_the_black_bowl_in_the_bottom_drawer_of_the_cabinet_and_close_it  (extract_libero10_inputs.py, 로봇 제거 + 씬 전체 framing)
#
# s5_tablefix.yaml(KIST) 기준에서 바꾼 것:
#   - paths / goal_task / save_dir : 이 태스크 입력
#   - asset_pool.root: null        : 전체 assets/(1800 카테고리). KIST 풀(kist_twin)에는 LIBERO 물체가 없다
#   - usd_pool 제거                 : 풀 root 가 없으므로 OG 데이터셋 USD 를 쓴다
#   - GAIA_NO_FIT_SCALE 쓰지 말 것  : 일반 에셋은 점군 크기에 맞춰 늘려야 한다
#   - DigitalCousinMatcher         : 카테고리당 모델이 많으므로 원래 default 값(top_k_models 6, cousin 4)
#   - support_yaw_align 제거        : 인덕션(electric_stove) 전용 보정
#   - physics_settle.fixed_categories : white_table -> 테이블/책상류 카테고리
#   - TaskObjectExtraction mode: task (observed_contents 는 KIST 그릇 내용물용)
#   - Step 6 asset_pool 제거, Step 7 inside_mode: legacy
#   - pipeline_steps: twin scene 만 만들도록 Step 1~3 만 켬
#
# 실행: python our_models_task_generation.py --config configs/libero10_03.yaml

seed: 42

paths:
  save_dir: "libero_10/03_KITCHEN_SCENE4_put_the_black_bowl_in_the_bottom_drawer_of_the_cabinet_and_close_it"
  test_rgb_img_path: "inputs_libero_10/03_KITCHEN_SCENE4_put_the_black_bowl_in_the_bottom_drawer_of_the_cabinet_and_close_it/camera_rgb.png"
  test_depth_img_path: "inputs_libero_10/03_KITCHEN_SCENE4_put_the_black_bowl_in_the_bottom_drawer_of_the_cabinet_and_close_it/camera_depth.npy"
  camera_intrinsics_matrix_path: "inputs_libero_10/03_KITCHEN_SCENE4_put_the_black_bowl_in_the_bottom_drawer_of_the_cabinet_and_close_it/camera_info.json"

gpt:
  version: "5.1"
  token_print: true

scene:
  find_front_view: true

position:
  inside_position_randomization: true
  max_bound: 1.0

rotation:
  rotation_randomization: false
  random_degree: 5.0

distractor:
  use_distractor_noise: false
  use_distractor_category: 3
  distractor_top_k: 1

task:
  goal_task: "put the black bowl in the bottom drawer of the cabinet and close it"

# null -> assets/ 전체(1800 카테고리)
asset_pool:
  root: null
  include_categories: null
  include_categories_file: null
  exclude_categories: []
  strict: true

pipeline_steps:
  run_step_1: true   # Real-world extraction
  run_step_2: true   # Digital cousin matching
  run_step_3: true   # Scene generation (twin scene)
  run_visualize_scene: false
  run_step_4_and_5: false
  run_step_6: false
  run_step_7: false
  run_og_test: false

models:
  FeatureMatcher:
    encoder: DinoV2Encoder
    encoder_kwargs: null
    gsam_box_threshold: 0.25
    gsam_text_threshold: 0.25

pipeline:
  verbose: true

  RealWorldExtractor:
    call:
      captions: null
      depth_model: "UniDepthV2"
      filter_backsplash: true
      infer_aligned_wall: true
      visualize: false

  DigitalCousinMatcher:
    call:
      top_k_categories: 3
      top_k_models: 6
      top_k_poses: 3
      n_digital_cousins: 4
      n_cousins_reselect_cand: 3
      remove_background: false
      gpt_select_cousins: true
      n_cousins_link_count_threshold: 10
      start_at_name: null

  RealSceneGenerator:
    call:
      n_scenes: 1
      sampling_method: ordered   # scene 0 에서 전부 1순위 cousin
      resolve_collision: true
      discard_objs: null
      visualize_scene: true
      visualize_scene_tilt_angle: 0
      visualize_scene_radius: 5
      save_visualization: true
      save_camera_info_extrinsic: false
      physics_settle:
        enabled: true
        steps: 300
        check_steps: 150
        # 카테고리 이름이 정확히 같아야 고정된다. LIBERO 테이블이 매칭될 법한 것들.
        fixed_categories: [breakfast_table, coffee_table, commercial_kitchen_table, conference_table,
                           console_table, countertop, desk, gaming_table, lab_table, pedestal_table]
        lift_margin_m: 0.001
        xy_tol_m: 0.02
        yaw_tol_deg: 5.0
        revert_xy_yaw: true

  VisualizeScene:
    call:
      scene_idx: 0
      output: null
      n_render_steps: 10000000
      visual_only: false

  TaskObjectExtractionAndSpatialReasoning:
    call:
      mode: task

  TaskObjectRetrieval:
    call:
      top_k_categories: 5
      top_k_models: 5
      n_digital_cousins: 2
      n_cousins_reselect_cand: 3
      remove_background: false
      gpt_select_cousins: true
      n_cousins_link_count_threshold: 10
      start_at_name: null
      exact_category_match: true
      allow_no_match: true

  TaskSceneGenerator:
    call:
      n_scenes: 1
      sampling_method: ordered
      resolve_collision: true
      discard_objs: null
      visualize_scene: true
      visualize_scene_tilt_angle: 0
      visualize_scene_radius: 5
      save_visualization: true
      inside_mode: legacy

  SimulatedSceneVisualize:
    call:
      n_scenes: 1
      sampling_method: ordered
      resolve_collision: true
      discard_objs: null
      visualize_scene: true
      visualize_scene_tilt_angle: 0
      visualize_scene_radius: 5
      save_visualization: true
